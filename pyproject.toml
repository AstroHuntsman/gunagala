[build-system]
requires = [
  "setuptools>=62.1",
  "setuptools_scm[toml]>=6.2",
  "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "gunagala"
description = "Performance modelling for astronomical instruments"
requires-python = ">=3.9"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "licenses/LICENSE.rst" }
authors = [
  { name = "Anthony Horton", email = "anthony.horton@mq.edu.au" },
]
dependencies = [
  "numpy",
  "astropy>=3.2",
  "scipy",
  "matplotlib",
  "numpy",
  "PyYAML"
  ]
dynamic = ["version"]

#[project.scripts]
# open_astronomy_package_template_example = "gunagala.example_mod:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-doctestplus",
    "pytest-cov"
]
docs = [
    "sphinx",
    "sphinx-automodapi",
]
[project.urls]
repository = "https://github.com/AstroHuntsman/gunagala"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]


[tool.setuptools_scm]
write_to = "gunagala/version.py"

[tool.pytest.ini_options]
testpaths = [
  "gunagala",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
 "gunagala/__init*",
 "gunagala/conftest.py",
 "gunagala/*setup_package*",
 "gunagala/tests/*",
 "gunagala/*/tests/*",
 "gunagala/extern/*",
 "gunagala/version*",
 "*/gunagala/__init*",
 "*/gunagala/conftest.py",
 "*/gunagala/*setup_package*",
 "*/gunagala/tests/*",
 "*/gunagala/*/tests/*",
 "*/gunagala/extern/*",
 "*/gunagala/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
  # typing.TYPE_CHECKING is False at runtime
  "if TYPE_CHECKING:",
  # Ignore typing overloads
  "@overload",
]
